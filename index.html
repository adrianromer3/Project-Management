<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Management</title>
  <meta name="description" content="Track projects end to end: tasks, timeline, budget and overall health.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M8 10h10M8 16h16M8 22h7' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // apply saved theme before paint
    try { const p = JSON.parse(localStorage.getItem('pm:v1:theme') || 'null'); if (p === 'dark' || (p == null && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] } } } };</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="./css/custom.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
  <div id="app" class="flex min-h-screen">
    <!-- Sidebar -->
    <div id="drawer-backdrop" class="fixed inset-0 z-30 hidden bg-slate-900/60 lg:hidden"></div>
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col bg-slate-900 text-slate-300 transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:w-60 lg:translate-x-0" aria-label="Main menu">
      <div class="flex items-center gap-3 border-b border-white/10 px-4 py-4">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-sky-500/15 text-sky-400">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h9M5 12h14M5 17h6"/></svg>
        </div>
        <div class="min-w-0"><div class="truncate text-sm font-semibold text-white">Project Management</div><div class="text-[11px] text-slate-400">Track every project, end to end</div></div>
        <button id="drawer-close" class="ml-auto rounded p-1 text-slate-400 hover:bg-white/10 lg:hidden" aria-label="Close menu">✕</button>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto px-3 py-3 text-sm"></nav>
      <div class="border-t border-white/10 px-4 py-3 text-[11px] text-slate-500">Data is saved in this browser. Export it from Settings.</div>
    </aside>

    <!-- Main -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
        <div class="flex items-center gap-2 px-3 py-2 sm:px-5">
          <button id="drawer-open" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 lg:hidden" aria-label="Open menu">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <h1 id="page-title" class="min-w-0 flex-1 truncate text-base font-semibold text-slate-900 dark:text-white"></h1>
          <button id="theme" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
        </div>
      </header>
      <main id="main" class="min-w-0 flex-1 px-3 pb-10 pt-4 sm:px-5" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:2rem">This app needs JavaScript enabled.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
